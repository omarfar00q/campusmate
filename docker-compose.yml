services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusmate-mcp-server
    command: python -m campusmate.server.app.main --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - CAMPUSMATE_TZ=UTC
      - DATABASE_URL=sqlite:///./campusmate.db
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
    volumes:
      - campusmate-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusmate-agent-api
    command: python -m campusmate.agent.api --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mcp-server:
        condition: service_healthy

volumes:
  campusmate-data:
